# Render Blueprint – one web service runs the API and serves the portal.
# Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: mock-api-portal
    runtime: node
    plan: free                      # free: sleeps after 15 min idle, files are lost on restart/redeploy
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # demo data registered on every start (free plan has no persistent disk); remove if not wanted
      - key: SEED_APIS
        value: agreement@v1=samples/agreement.json
    # --- Keep data across restarts (paid plan only): uncomment and change plan to "starter" ---
    # disk:
    #   name: mock-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add the env var  DATA_DIR=/var/data
